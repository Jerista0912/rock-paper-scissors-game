<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK, PAPER, SCISSOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   
</head>
<body style="font-family: 'Bangers',cursive;">
<div style="padding-left:30%;padding-top:10%;">
<div class="card text-center " style="width: 30rem;border-radius: 20px; ">
  <div class="card-body bg-primary bg-gradient "style="border-radius: 20px;">
    <h1 class="card-title">Rock, Paper, Scissor Game</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger"style="font-family: 'Poppins',sans-serif;" name="choice" value="rock">Rock</button>
    <button type="submit" class="btn btn-danger"style="font-family: 'Poppins',sans-serif; "name="choice" value="paper">Paper</button>
    <button type="submit" class="btn btn-danger"style="font-family: 'Poppins',sans-serif;" name="choice" value="scissor">Scissors</button>
</form>

<h4><p class="text-capitalize"style="font-family: 'Poppins',sans-serif;" ><b>User Choice: </b>{{ userchoice }}</h4></p>
<h4><p class="text-capitalize"style="font-family: 'Poppins',sans-serif;"><b>CPU Choice: </b>{{ cpuchoice }}</h4></p> 

{% if result %}
    <center><h3 style="font-family: 'Poppins',sans-serif;"><b>Result:</b><span class="badge rounded-pill text-bg-secondary"style="font-family: 'Poppins',sans-serif;">{{ result }}</span></h3></center>
{% endif %}
 </div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
